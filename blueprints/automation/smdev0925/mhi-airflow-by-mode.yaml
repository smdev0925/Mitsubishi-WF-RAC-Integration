blueprint:
  name: MHI airflow by mode
  author: smdev0925
  homeassistant:
    min_version: "2024.12.0"
  description: >-
    **Version 1.1.0** — 10 October 2026


    Sets the fan speed and the two vanes when a unit changes mode. Choose the
    values for each mode. **No change** leaves that setting as it is.


    Make one automation for each unit, so each unit has its own settings.


    It runs only when the mode changes. A change you make by hand stays until
    the next mode change. A unit that comes back from unavailable is not
    changed.


    **3D auto** moves both vanes. Choose it for one vane and set the other to
    **No change**.


    It does not change a mode, so you can use it with the AUTO replacement and
    the resolver.
  domain: automation
  input:
    unit:
      name: Unit
      icon: mdi:hvac
      input:
        climate_entity:
          name: Climate entity
          selector:
            entity:
              filter:
                - integration: mitsubishi_wf_rac
                  domain: climate
    cool:
      name: Cool
      icon: mdi:snowflake
      collapsed: true
      input:
        cool_fan:
          name: Fan speed
          default: keep
          selector: &fan
            select:
              options:
                - { label: No change, value: keep }
                - { label: Auto, value: auto }
                - { label: Quiet, value: quiet }
                - { label: Low, value: low }
                - { label: Medium, value: medium }
                - { label: High, value: high }
        cool_swing:
          name: Vertical vane
          default: keep
          selector: &swing
            select:
              options:
                - { label: No change, value: keep }
                - { label: Up/down auto, value: up_down_auto }
                - { label: Highest, value: highest }
                - { label: Middle, value: middle }
                - { label: Normal, value: normal }
                - { label: Lowest, value: lowest }
                - { label: 3D auto, value: 3d_auto }
        cool_horizontal:
          name: Horizontal vane
          default: keep
          selector: &horizontal
            select:
              options:
                - { label: No change, value: keep }
                - { label: Left/right auto, value: left_right_auto }
                - { label: Left-left, value: left_left }
                - { label: Left-center, value: left_center }
                - { label: Center-center, value: center_center }
                - { label: Center-right, value: center_right }
                - { label: Right-right, value: right_right }
                - { label: Left-right, value: left_right }
                - { label: Right-left, value: right_left }
                - { label: 3D auto, value: 3d_auto }
    heat:
      name: Heat
      icon: mdi:fire
      collapsed: true
      input:
        heat_fan: { name: Fan speed, default: keep, selector: *fan }
        heat_swing: { name: Vertical vane, default: keep, selector: *swing }
        heat_horizontal:
          { name: Horizontal vane, default: keep, selector: *horizontal }
    dry:
      name: Dry
      icon: mdi:water-percent
      collapsed: true
      input:
        dry_fan: { name: Fan speed, default: keep, selector: *fan }
        dry_swing: { name: Vertical vane, default: keep, selector: *swing }
        dry_horizontal:
          { name: Horizontal vane, default: keep, selector: *horizontal }
    fan_only:
      name: Fan only
      icon: mdi:fan
      collapsed: true
      input:
        fan_only_fan: { name: Fan speed, default: keep, selector: *fan }
        fan_only_swing: { name: Vertical vane, default: keep, selector: *swing }
        fan_only_horizontal:
          { name: Horizontal vane, default: keep, selector: *horizontal }
    auto:
      name: Auto
      icon: mdi:thermostat-auto
      collapsed: true
      input:
        auto_fan: { name: Fan speed, default: keep, selector: *fan }
        auto_swing: { name: Vertical vane, default: keep, selector: *swing }
        auto_horizontal:
          { name: Horizontal vane, default: keep, selector: *horizontal }

# The latest mode wins if the unit changes again during a run.
mode: restart

triggers:
  # A mode change only. Not from unavailable: the hourly reconnect would
  # otherwise undo every change made by hand.
  - trigger: state
    entity_id: !input climate_entity
    not_from: [unavailable, unknown]
    to: [cool, heat, dry, fan_only, auto]

variables:
  unit: !input climate_entity
  hvac: "{{ trigger.to_state.state }}"
  settings:
    cool: [!input cool_fan, !input cool_swing, !input cool_horizontal]
    heat: [!input heat_fan, !input heat_swing, !input heat_horizontal]
    dry: [!input dry_fan, !input dry_swing, !input dry_horizontal]
    fan_only: [!input fan_only_fan, !input fan_only_swing, !input fan_only_horizontal]
    auto: [!input auto_fan, !input auto_swing, !input auto_horizontal]
  fan: "{{ settings[hvac][0] }}"
  swing: "{{ settings[hvac][1] }}"
  horizontal: "{{ settings[hvac][2] }}"

# Each setting is sent only if the unit lists the value and is not at it
# already. 'keep' is in no list, and a unit with no horizontal vane has none.
actions:
  - if:
      - "{{ fan in (state_attr(unit, 'fan_modes') or []) and fan != state_attr(unit, 'fan_mode') }}"
    then:
      - action: climate.set_fan_mode
        target:
          entity_id: "{{ unit }}"
        data:
          fan_mode: "{{ fan }}"
  - if:
      - "{{ swing in (state_attr(unit, 'swing_modes') or []) and swing != state_attr(unit, 'swing_mode') }}"
    then:
      - action: climate.set_swing_mode
        target:
          entity_id: "{{ unit }}"
        data:
          swing_mode: "{{ swing }}"
  - if:
      - "{{ horizontal in (state_attr(unit, 'swing_horizontal_modes') or []) and horizontal != state_attr(unit, 'swing_horizontal_mode') }}"
    then:
      - action: climate.set_swing_horizontal_mode
        target:
          entity_id: "{{ unit }}"
        data:
          swing_horizontal_mode: "{{ horizontal }}"
