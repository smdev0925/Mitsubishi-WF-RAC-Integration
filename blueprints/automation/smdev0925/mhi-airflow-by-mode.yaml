blueprint:
  name: MHI airflow by mode
  author: smdev0925
  homeassistant:
    min_version: "2024.12.0"
  description: >-
    **Version 2.1.0** — 10 October 2026


    Sets the fan speed and the two vanes when a unit changes mode. Choose the
    values for each mode. **No change** leaves that setting as it is.


    Each group has its own settings. To give a unit its own settings, put it in
    a group alone. Units that share settings can share a group. Put each unit
    in one group only.


    It runs only when the mode changes. A change you make by hand stays until
    the next mode change. A unit that comes back from unavailable is not
    changed.


    **3D auto** has its own switch for each mode. When it is on, the unit moves
    both vanes itself and the vane settings for that mode are not used. A unit
    without 3D auto uses the vane settings. To end 3D auto, choose a vane
    position.


    It does not change a mode, so you can use it with the AUTO replacement and
    the resolver.
  domain: automation
  input:
    group_1:
      name: Group 1
      icon: mdi:hvac
      collapsed: false
      input:
        group_1_units:
          name: Units
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: mitsubishi_wf_rac
                  domain: climate
        group_1_cool_fan:
          name: Cool fan speed
          default: keep
          selector: &fan
            select:
              options:
                - { label: No change, value: keep }
                - { label: Auto, value: auto }
                - { label: Quiet, value: quiet }
                - { label: Low, value: low }
                - { label: Medium, value: medium }
                - { label: High, value: high }
        group_1_cool_swing:
          name: Cool vertical vane
          default: keep
          selector: &swing
            select:
              options:
                - { label: No change, value: keep }
                - { label: Up/down auto, value: up_down_auto }
                - { label: Highest, value: highest }
                - { label: Middle, value: middle }
                - { label: Normal, value: normal }
                - { label: Lowest, value: lowest }
        group_1_cool_horizontal:
          name: Cool horizontal vane
          default: keep
          selector: &horizontal
            select:
              options:
                - { label: No change, value: keep }
                - { label: Left/right auto, value: left_right_auto }
                - { label: Left-left, value: left_left }
                - { label: Left-center, value: left_center }
                - { label: Center-center, value: center_center }
                - { label: Center-right, value: center_right }
                - { label: Right-right, value: right_right }
                - { label: Left-right, value: left_right }
                - { label: Right-left, value: right_left }
        group_1_cool_3d: { name: Cool 3D auto, default: false, selector: { boolean: {} } }
        group_1_heat_fan: { name: Heat fan speed, default: keep, selector: *fan }
        group_1_heat_swing: { name: Heat vertical vane, default: keep, selector: *swing }
        group_1_heat_horizontal: { name: Heat horizontal vane, default: keep, selector: *horizontal }
        group_1_heat_3d: { name: Heat 3D auto, default: false, selector: { boolean: {} } }
        group_1_dry_fan: { name: Dry fan speed, default: keep, selector: *fan }
        group_1_dry_swing: { name: Dry vertical vane, default: keep, selector: *swing }
        group_1_dry_horizontal: { name: Dry horizontal vane, default: keep, selector: *horizontal }
        group_1_dry_3d: { name: Dry 3D auto, default: false, selector: { boolean: {} } }
        group_1_fan_only_fan: { name: Fan only fan speed, default: keep, selector: *fan }
        group_1_fan_only_swing: { name: Fan only vertical vane, default: keep, selector: *swing }
        group_1_fan_only_horizontal: { name: Fan only horizontal vane, default: keep, selector: *horizontal }
        group_1_fan_only_3d: { name: Fan only 3D auto, default: false, selector: { boolean: {} } }
        group_1_auto_fan: { name: Auto fan speed, default: keep, selector: *fan }
        group_1_auto_swing: { name: Auto vertical vane, default: keep, selector: *swing }
        group_1_auto_horizontal: { name: Auto horizontal vane, default: keep, selector: *horizontal }
        group_1_auto_3d: { name: Auto 3D auto, default: false, selector: { boolean: {} } }
    group_2:
      name: Group 2
      icon: mdi:hvac
      collapsed: true
      input:
        group_2_units:
          name: Units
          default: []
          selector:
            entity:
