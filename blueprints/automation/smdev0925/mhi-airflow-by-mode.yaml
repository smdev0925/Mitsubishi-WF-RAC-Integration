# Runs in turn, so the last mode change of a unit is the one that stays.
mode: queued
max: 25

# A mode change only. Not from unavailable: the hourly reconnect would
# otherwise undo every change made by hand. The trigger id is the group.
triggers:
  - trigger: state
    id: "1"
    entity_id: !input group_1_units
    not_from: [unavailable, unknown]
    to: [cool, heat, dry, fan_only, auto]
  - trigger: state
    id: "2"
    entity_id: !input group_2_units
    not_from: [unavailable, unknown]
    to: [cool, heat, dry, fan_only, auto]
  - trigger: state
    id: "3"
    entity_id: !input group_3_units
    not_from: [unavailable, unknown]
    to: [cool, heat, dry, fan_only, auto]
  - trigger: state
    id: "4"
    entity_id: !input group_4_units
    not_from: [unavailable, unknown]
    to: [cool, heat, dry, fan_only, auto]
  - trigger: state
    id: "5"
    entity_id: !input group_5_units
    not_from: [unavailable, unknown]
    to: [cool, heat, dry, fan_only, auto]
  - trigger: state
    id: "6"
    entity_id: !input group_6_units
    not_from: [unavailable, unknown]
    to: [cool, heat, dry, fan_only, auto]

variables:
  unit: "{{ trigger.entity_id }}"
  hvac: "{{ trigger.to_state.state }}"
  # One entry per group, in group order: mode -> [fan, vertical, horizontal, 3D].
  groups:
    - cool: [!input group_1_cool_fan, !input group_1_cool_swing, !input group_1_cool_horizontal, !input group_1_cool_3d]
      heat: [!input group_1_heat_fan, !input group_1_heat_swing, !input group_1_heat_horizontal, !input group_1_heat_3d]
      dry: [!input group_1_dry_fan, !input group_1_dry_swing, !input group_1_dry_horizontal, !input group_1_dry_3d]
      fan_only: [!input group_1_fan_only_fan, !input group_1_fan_only_swing, !input group_1_fan_only_horizontal, !input group_1_fan_only_3d]
      auto: [!input group_1_auto_fan, !input group_1_auto_swing, !input group_1_auto_horizontal, !input group_1_auto_3d]
    - cool: [!input group_2_cool_fan, !input group_2_cool_swing, !input group_2_cool_horizontal, !input group_2_cool_3d]
      heat: [!input group_2_heat_fan, !input group_2_heat_swing, !input group_2_heat_horizontal, !input group_2_heat_3d]
      dry: [!input group_2_dry_fan, !input group_2_dry_swing, !input group_2_dry_horizontal, !input group_2_dry_3d]
      fan_only: [!input group_2_fan_only_fan, !input group_2_fan_only_swing, !input group_2_fan_only_horizontal, !input group_2_fan_only_3d]
      auto: [!input group_2_auto_fan, !input group_2_auto_swing, !input group_2_auto_horizontal, !input group_2_auto_3d]
    - cool: [!input group_3_cool_fan, !input group_3_cool_swing, !input group_3_cool_horizontal, !input group_3_cool_3d]
      heat: [!input group_3_heat_fan, !input group_3_heat_swing, !input group_3_heat_horizontal, !input group_3_heat_3d]
      dry: [!input group_3_dry_fan, !input group_3_dry_swing, !input group_3_dry_horizontal, !input group_3_dry_3d]
      fan_only: [!input group_3_fan_only_fan, !input group_3_fan_only_swing, !input group_3_fan_only_horizontal, !input group_3_fan_only_3d]
      auto: [!input group_3_auto_fan, !input group_3_auto_swing, !input group_3_auto_horizontal, !input group_3_auto_3d]
    - cool: [!input group_4_cool_fan, !input group_4_cool_swing, !input group_4_cool_horizontal, !input group_4_cool_3d]
      heat: [!input group_4_heat_fan, !input group_4_heat_swing, !input group_4_heat_horizontal, !input group_4_heat_3d]
      dry: [!input group_4_dry_fan, !input group_4_dry_swing, !input group_4_dry_horizontal, !input group_4_dry_3d]
      fan_only: [!input group_4_fan_only_fan, !input group_4_fan_only_swing, !input group_4_fan_only_horizontal, !input group_4_fan_only_3d]
      auto: [!input group_4_auto_fan, !input group_4_auto_swing, !input group_4_auto_horizontal, !input group_4_auto_3d]
    - cool: [!input group_5_cool_fan, !input group_5_cool_swing, !input group_5_cool_horizontal, !input group_5_cool_3d]
      heat: [!input group_5_heat_fan, !input group_5_heat_swing, !input group_5_heat_horizontal, !input group_5_heat_3d]
      dry: [!input group_5_dry_fan, !input group_5_dry_swing, !input group_5_dry_horizontal, !input group_5_dry_3d]
      fan_only: [!input group_5_fan_only_fan, !input group_5_fan_only_swing, !input group_5_fan_only_horizontal, !input group_5_fan_only_3d]
      auto: [!input group_5_auto_fan, !input group_5_auto_swing, !input group_5_auto_horizontal, !input group_5_auto_3d]
    - cool: [!input group_6_cool_fan, !input group_6_cool_swing, !input group_6_cool_horizontal, !input group_6_cool_3d]
      heat: [!input group_6_heat_fan, !input group_6_heat_swing, !input group_6_heat_horizontal, !input group_6_heat_3d]
      dry: [!input group_6_dry_fan, !input group_6_dry_swing, !input group_6_dry_horizontal, !input group_6_dry_3d]
      fan_only: [!input group_6_fan_only_fan, !input group_6_fan_only_swing, !input group_6_fan_only_horizontal, !input group_6_fan_only_3d]
      auto: [!input group_6_auto_fan, !input group_6_auto_swing, !input group_6_auto_horizontal, !input group_6_auto_3d]
  settings: "{{ groups[trigger.id | int - 1][hvac] }}"
  fan: "{{ settings[0] }}"
  # 3D auto is one flag for both vanes, and a vane position clears it. So when
  # it is on, it replaces both vane settings - if the unit has it.
  three_d: "{{ settings[3] and '3d_auto' in (state_attr(unit, 'swing_modes') or []) }}"
  swing: "{{ '3d_auto' if three_d else settings[1] }}"
  horizontal: "{{ 'keep' if three_d else settings[2] }}"

# A setting is sent if the unit lists the value. 'keep' is in no list, and a
# unit with no horizontal vane has none. Sent even if the unit reads it as set
# already: some units always read 3D auto as off and the horizontal vane as
# auto (docs/wf-rac-module-reference.md 6.7).
actions:
  - if:
      - "{{ fan in (state_attr(unit, 'fan_modes') or []) }}"
    then:
      - action: climate.set_fan_mode
        target:
          entity_id: "{{ unit }}"
        data:
          fan_mode: "{{ fan }}"
  - if:
      - "{{ swing in (state_attr(unit, 'swing_modes') or []) }}"
    then:
      - action: climate.set_swing_mode
        target:
          entity_id: "{{ unit }}"
        data:
          swing_mode: "{{ swing }}"
  - if:
      - "{{ horizontal in (state_attr(unit, 'swing_horizontal_modes') or []) }}"
    then:
      - action: climate.set_swing_horizontal_mode
        target:
          entity_id: "{{ unit }}"
        data:
          swing_horizontal_mode: "{{ horizontal }}"
