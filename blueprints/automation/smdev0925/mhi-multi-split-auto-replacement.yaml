blueprint:
  name: MHI multi-split AUTO replacement
  author: smdev0925
  homeassistant:
    min_version: "2024.10.0"
  description: >-
    This blueprint replaces the AUTO mode of each indoor unit. It selects
    cooling or heating from the room temperature and the setpoint of the unit.


    The setpoint is the temperature that you want. The blueprint reads the
    setpoint from the unit. It does not write a setpoint. If you set 21 °C on
    the unit, the blueprint controls the room to 21 °C.


    The two limits are distances from the setpoint. They are not temperatures.
    Thus one pair of values is correct for all rooms.


    ## The rules


    `T` is the room temperature. `S` is the setpoint of the unit.


    1. If a unit cools, and `T` is less than `S` minus the Cooling Limit, change
       the unit to heating.

    2. If a unit heats, and `T` is more than `S` plus the Heating Limit, change
       the unit to cooling.

    3. In all other conditions, do not change the unit.


    Example. The setpoint is 21 °C. Both limits are 2 °C. The unit cools. At
    18.9 °C the blueprint changes the unit to heating. The setpoint stays at
    21 °C. The unit heats. At 23.1 °C the blueprint changes the unit to cooling.
    If you set the setpoint to 23 °C, the band moves with it.


    Each rule operates in one direction only. If a unit cools and the room is too
    warm, the unit is correct. The blueprint does not change it. This is also
    applicable to a unit that heats when the room is too cold.


    Rule 3 applies most of the time. If a unit is at its setpoint and stops, the
    blueprint does not change it.


    ## Warning: each unit changes its mode


    Each unit in the list changes between heating and cooling without a command
    from you. This is the function of the blueprint. If a room must not have
    heating, or must not have cooling, do not add its unit to the list.


    A unit operates at high power for approximately 15 minutes after a mode
    change. It goes past the setpoint. Increase the limits before you decrease
    the dwell time.


    ## Modes that the blueprint ignores


    The blueprint ignores `off`, `dry`, `auto` and `fan_only`. The mode rules do
    not write to a unit in these modes, and they do not put a unit into them.


    - **`off`** — the room does not need control.

    - **`auto`** — this blueprint replaces AUTO. A unit in AUTO controls itself,
      and the two controls disagree. To remove a unit from the group, set it to
      AUTO. But a unit in AUTO still makes a request to the outdoor unit, and
      the blueprint cannot see this request. Refer to the lockout data below.

    - **`fan_only`** — you control this mode. The mode rules do not change it.
      Read the data about idle units before you keep a unit in fan mode for a
      long time. Lockout protection uses fan mode for a short time, and then it
      puts the unit back.

    - **`dry`** — this is a known limitation. Dry is a cooling request, and the
      unit uses the setpoint differently. Thus rule 1 could change a unit that
      removes humidity to heating. The blueprint keeps a unit in dry. Dry keeps
      the outdoor unit in cooling. The lockout logic counts dry as a cooling
      request that it cannot change.


    The blueprint also ignores a unit that is unavailable, a unit that does not
    give a room temperature, and a unit that does not give a setpoint.


    ## Lockout protection


    One outdoor unit supplies one mode at one time. This blueprint sets cooling
    or heating on each indoor unit. Thus two units can request opposite modes.
    One unit gets the compressor. The other unit is locked out: its fan
    operates, its coil is not active, and its room temperature moves away from
    the setpoint.


    Set **Lockout protection** to on. The blueprint then uses the rules of the
    *MHI multi-split mode lockout resolver*:


    1. **All units request the same mode.** No action is necessary.

    2. **The units request different modes, and one unit calls.** The unit that
       operates the compressor keeps it. The release grace continues through the
       compressor cycles.

    3. **The units request different modes, and no unit calls.** The units on the
       side that operated last change to fan mode for a short time. This removes
       their demand, and the other side gets the outdoor unit. After the delay,
       the blueprint puts these units back to their mode.


    There are two differences from that blueprint. The blueprint sets each mode
    here, but you set each mode there.


    - **A Cool/Heat Status sensor is not necessary.** That sensor shows the
      selection of the AUTO mode. No unit here is in AUTO, thus the request of a
      unit is its mode. You do not enable an extra sensor.

    - **There is no mode lock.** In the resolver, a `cool` or `heat` mode is your
      command, and the resolver never changes it. This is why the two blueprints
      stop each other. Here, rule 1 or rule 2 set each mode, thus a change to fan
      mode for two minutes does not disobey a command. **Use this blueprint or
      the resolver on a unit. Do not use both.**


    The second difference also makes the fan time shorter. The resolver must
    hold a unit in fan mode long enough for it to drop its AUTO latch. No unit
    here is in AUTO, so there is no latch to drop, and the delay only has to
    cover the outdoor unit releasing and selecting a side again.


    The blueprint cannot move a unit in `dry`. Dry requests cooling, and the
    blueprint does not write to it. Thus the cooling side cannot change to fan
    mode while a unit is in dry. The blueprint writes this condition to the
    logbook.


    If lockout protection is off, the mode rules operate as above. The blueprint
    writes a split to the logbook and does no more. Use this setting on a single
    split system, where a lockout cannot occur.


    ## Known limitation: an interrupted run


    The blueprint changes a unit to fan mode and puts it back in one run, with a
    delay between the two steps. If the run stops, the unit stays in fan mode. A
    restart, a reload or a configuration check can stop the run. The mode rules
    ignore fan mode, thus the blueprint cannot correct this condition. Set the
    mode manually. The trace shows this unit as not in the group.


    ## The temperature reading


    The blueprint uses one value: the `current_temperature` of the unit. A sensor
    in the air inlet at the top of the unit gives this value. **The value is
    correct only if air moves across the sensor.** If the compressor is off and
    the fan is slow, the sensor reads the air at the ceiling. In a wall unit,
    this air is warmer than the room.


    There are two methods to correct this, both in the integration:


    - Set an **Indoor Offset** on the device.

    - Give a room sensor to the integration. Use the external temperature source
      option, or the `mitsubishi_wf_rac.set_external_temperature` action. Then
      `current_temperature` is the value of your sensor, and this data does not
      apply.


    ## Idle units on a shared circuit


    Data measured on an SCM multi-split with the EEV Position sensor of each unit
    `[observed on hardware]`:


    - **When the system cools**, the expansion valve of each unit that does not
      call is at **0 %**. This includes a unit in fan mode. The valve is closed.
      These units do not change their rooms, and their sensors are correct.

    - **When the system heats**, the valve of each unit stays open. This is also
      applicable to a unit that does not call. A unit in fan mode measured
      **24 %**.


    Thus an idle unit has no thermal effect in cooling, but it has an effect in
    heating. A unit in fan mode is a heater of low power when the system heats.
    It moves air across a coil that contains refrigerant. It heats its room, and
    its sensor reads this warm air.


    There are two results:


    - Fan mode does not give a correct temperature reading during heating. This
      is why the blueprint does not put a unit into fan mode.

    - A change to fan mode is not free. Two minutes in fan mode during heating
      puts some heat into that room. Keep the fan time short.


    EEV Position is a diagnostic sensor, and it is disabled by default. There is
    one sensor for each unit. On a multi-split, this value is different for each
    indoor unit. Compressor frequency, current and discharge temperature are not
    different. The value is relative, and it is not calibrated.


    ## Timing


    **Dwell** is for each unit. It starts at the last mode change of that unit.
    A mode change also occurs when the module disconnects from the network and
    connects again, and the module does this for approximately one minute each
    hour. A change to fan mode also starts it. The blueprint does not change a
    unit until the dwell time is complete. Dwell delays a change, but it cannot
    cause a change.


    **Settle** is for all units. A command needs time before the unit reports its
    new state. The integration reads the module one time each minute, and a write
    holds the module for approximately one minute. Thus the state is old for a
    short time after a change. Settle prevents a second command against the old
    state.


    **Cooldown** applies to the units that a stand-down would move. It stops the
    same units being stood down again while they are still at high power from the
    last change.


    All three times are measured from the last mode change of a unit, and not
    from the last run of this automation. Every change that the blueprint makes
    writes a mode to a unit, thus the units hold the record. This also lets debug
    logging write an entry on every run without an effect on the times.


    One run does one task. If a unit needs a mode change, the blueprint makes the
    change. The lockout check then waits for the next run, when the new modes are
    in the state.


    ## Debug logging


    Set **Log every decision** to on. The blueprint then writes one logbook entry
    on each run, with the decision and the data behind it. It is self contained:
    it needs no helper, and it changes no behaviour. Turn it off when the tests
    are complete, because it writes approximately 288 entries each day.
  domain: automation
  input:
    fleet:
      name: The units
      icon: mdi:hvac
      description: >-
        Each indoor unit that the blueprint can change. The blueprint ignores a
        unit in `off`, `dry`, `auto` or `fan_only`.
      input:
        climate_entities:
          name: Climate entities
          selector:
            entity:
              multiple: true
              filter:
                - integration: mitsubishi_wf_rac
                  domain: climate
    limits:
      name: The limits
      icon: mdi:thermometer-lines
      description: >-
        Both values are distances from the setpoint of the unit, in degrees.
        They are not temperatures. Together they make the band of each unit.
      input:
        cool_limit:
          name: Cooling Limit Threshold
          description: >-
            The distance **below** the setpoint. If the room goes below this
            point, the blueprint changes a unit that cools to heating. With a
            setpoint of 21 and a value of 2, the unit changes at 19.
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
        heat_limit:
          name: Heating Limit Threshold
          description: >-
            The distance **above** the setpoint. If the room goes above this
            point, the blueprint changes a unit that heats to cooling. With a
            setpoint of 21 and a value of 2, the unit changes at 23.
          default: 2
          selector:
            number:
              min: 0.5
              max: 10
              step: 0.5
              unit_of_measurement: "°C"
              mode: box
    lockout:
      name: Lockout protection
      icon: mdi:lock-open-alert
      description: >-
        For a multi-split system, where two units that request opposite modes
        cause a lockout. Set this to off on a single split system.
      input:
        lockout_protection:
          name: Resolve lockouts
          description: >-
            Off: the blueprint writes a split to the logbook and does no more.
            On: the units on the side that operated last change to fan mode for
            a short time. The other side then gets the outdoor unit. The
            blueprint then puts these units back.
          default: false
          selector:
            boolean:
        demand_sensors:
          name: Compressor Demand sensors
          description: >-
            Necessary only when the protection is on. Select one sensor for each
            unit. These sensors are enabled by default. The blueprint matches
            them to the climate entities by device, thus the sequence is not
            important. If a unit has no sensor, the blueprint cannot know if that
            unit operated last. It then makes no change.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - integration: mitsubishi_wf_rac
                  domain: binary_sensor
        release_grace_minutes:
          name: Release grace
          description: >-
            The time that a unit continues to count as in use after its
            compressor demand stops. The demand stops between the compressor
            cycles. Without this time, a unit that is not complete reads as
            complete, and it loses the outdoor unit.
          default: 10
          selector:
            number:
              min: 2
              max: 60
              unit_of_measurement: minutes
              mode: box
        cooldown_minutes:
          name: Cooldown between changes to fan mode
          description: >-
            Keep this time more than the settle time of the unit after a mode
            change, which is approximately 15 minutes. The time starts at the
            last action of this blueprint, and a mode change is an action.
          default: 20
          selector:
            number:
              min: 18
              max: 120
              unit_of_measurement: minutes
              mode: box
        relax_delay:
          name: Time in fan mode
          description: >-
            The time that the units stay in fan mode while the outdoor unit
            changes side. Two minutes is sufficient on a four-unit SCM80: the
            outdoor unit selects the new side within seconds of the modes
            changing `[observed on hardware]`.


            This is shorter than the mode lockout resolver uses, and the reason
            is a different mechanism. That blueprint must hold a unit in fan mode
            long enough for the unit to drop its AUTO latch. No unit here is in
            AUTO, so there is no latch. Do not copy that figure across.


            Increase this time if the waiting side does not start. But a unit in
            fan mode during heating puts heat into its room, so do not make it
            longer than necessary.
          default:
            hours: 0
            minutes: 2
            seconds: 0
          selector:
            duration:
    debug:
      name: Debug
      icon: mdi:bug-outline
      collapsed: true
      description: >-
        Write what the automation decided to the logbook on every run, including
        the runs that do nothing.
      input:
        debug_logbook:
          name: Log every decision
          description: >-
            One logbook entry every five minutes saying what was decided and the
            evidence for it, including the runs that change nothing. It needs no
            helper and it changes no behaviour: the settle and cooldown times are
            measured from the units, not from this automation's own last run.


            Turn it off when you have finished testing. It writes about 288
            entries a day.
          default: false
          selector:
            boolean:
    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        dwell_minutes:
          name: Dwell before the next change of a unit
          description: >-
            For each unit. Keep this time more than the high-power time of the
            unit after a mode change, which is approximately 15 minutes. If the
            time is less, each change is a result of the temperature overshoot
            from the last change.
          default: 20
          selector:
            number:
              min: 15
              max: 180
              unit_of_measurement: minutes
              mode: box
        settle_minutes:
          name: Settle after a change
          description: >-
            For all units. The time to make no change after a run. The next run
            then reads the new state of the units, and not the old state.
          default: 5
          selector:
            number:
              min: 3
              max: 60
              unit_of_measurement: minutes
              mode: box

mode: single
max_exceeded: silent

trace:
  stored_traces: 25

triggers:
  # Five minutes, and not one minute. A command holds the module for
  # approximately one minute, and the integration reads the module one time each
  # minute. A shorter interval thus reads the old state. A longer interval is
  # sufficient, because the dwell time is tens of minutes.
  - trigger: time_pattern
    minutes: "/5"

variables:
  climate_entities: !input climate_entities
  cool_limit: !input cool_limit
  heat_limit: !input heat_limit
  lockout_protection: !input lockout_protection
  demand_sensors: !input demand_sensors
  release_grace_minutes: !input release_grace_minutes
  cooldown_minutes: !input cooldown_minutes
  relax_delay: !input relax_delay
  debug_logbook: !input debug_logbook
  dwell_minutes: !input dwell_minutes
  settle_minutes: !input settle_minutes

  # Home Assistant renders these variables in the order they are written, and
  # each one sees only the variables above it. A reference to one further down
  # raises UndefinedError, and the run is abandoned before the conditions are
  # reached - no actions, no logbook entry, only a line in the log. So the
  # variables with no dependencies of their own come first.
  #
  # The units in dry. Dry is a cooling request that the blueprint cannot change,
  # because it does not write to dry. Needed by four variables below.
  dry_heads: >-
    {% set ns = namespace(items=[]) %}
    {% for c in climate_entities if states(c) == 'dry' %}
      {% set ns.items = ns.items + [c] %}
    {% endfor %}
    {{ ns.items }}

  # One row for each unit in the group: on, available, in cool or heat, and with
  # a room temperature and a setpoint. The modes off, dry, auto and fan_only are
  # not in this list.
  #   want    = the mode from the rules; equal to mode if no limit was passed
  #   change  = want is different from mode, and the dwell time is complete
  #   calling = the compressor operates for this unit, plus the release grace
  #   since   = minutes from the last change of its demand; the minimum value is
  #             the unit that operated last
  # Both limits are distances from the setpoint of that unit. Thus each room has
  # its own band, and the blueprint writes no setpoint.
  fleet: >-
    {% set ns = namespace(items=[]) %}
    {% for c in climate_entities %}
      {% set s = states[c] %}
      {% set mode = s.state if s is not none else 'unknown' %}
      {% set temp = state_attr(c, 'current_temperature') %}
      {% set target = state_attr(c, 'temperature') %}
      {% if mode in ['cool', 'heat'] and temp is number and target is number %}
        {# Each rule operates in one direction. A unit that cools in a warm room
           is correct, and so is a unit that heats in a cold room. #}
        {% set want = 'heat' if mode == 'cool' and temp < target - cool_limit
                 else 'cool' if mode == 'heat' and temp > target + heat_limit
                 else mode %}
        {% set dwell = (now() - s.last_changed).total_seconds() / 60 %}
        {% set dev = device_id(c) %}
        {# The filter 'first' gives Undefined for an empty list, and Undefined is
           not none. Thus the index is explicit here. #}
        {% set matched = [] if dev is none
                         else demand_sensors | select('in', device_entities(dev)) | list %}
        {% set demand = matched[0] if matched | count > 0 else none %}
        {% set d = states[demand] if demand is not none else none %}
        {% set since = 99999 if d is none
                       else ((now() - d.last_changed).total_seconds() / 60) %}
        {% set ns.items = ns.items + [{
             'entity': c,
             'mode': mode,
             'want': want,
             'change': want != mode and dwell >= dwell_minutes,
             'held': want != mode and dwell < dwell_minutes,
             'calling': d is not none and (d.state == 'on'
                        or (d.state == 'off' and since < release_grace_minutes)),
             'since': since | round(1),
             'after': want if (want != mode and dwell >= dwell_minutes) else mode,
             'temp': temp,
             'target': target,
             'dwell': dwell | round(1) }] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

  changes: "{{ fleet | selectattr('change') | list }}"
  held: "{{ fleet | selectattr('held') | list }}"

  # Settle and cooldown are measured from the units themselves, not from the
  # automation's last_triggered. Every change this blueprint makes writes a mode
  # to a unit, which resets that unit's last_changed, so the units carry the
  # record. This also keeps debug logging free of side effects: it reaches the
  # actions on every run, which would overwrite last_triggered and stop the
  # automation acting at all.
  #
  # The module drops off the network for about a minute each hour, and that also
  # resets last_changed. So after a reconnect both gates wait again. That delays
  # a change; it never causes one.
  settle_passed: >-
    {% set d = fleet | map(attribute='dwell') | list %}
    {{ d | count == 0 or d | min >= settle_minutes }}

  # The modes of the units after this run writes all changes. Dry counts as the
  # cooling request that it is.
  after_cooling: >-
    {{ (fleet | selectattr('after', 'eq', 'cool') | map(attribute='entity') | list)
       + dry_heads }}
  after_heating: >-
    {{ fleet | selectattr('after', 'eq', 'heat') | map(attribute='entity') | list }}
  after_split: >-
    {{ after_cooling | count > 0 and after_heating | count > 0 }}

  # --- lockout ---------------------------------------------------------------
  # --- lockout ---------------------------------------------------------------
  # The mode of a unit is its request. No unit is in AUTO, thus there is no
  # selection to read from a Cool/Heat Status sensor.
  cooling_votes: >-
    {{ (fleet | selectattr('mode', 'eq', 'cool') | map(attribute='entity') | list)
       + dry_heads }}
  heating_votes: >-
    {{ fleet | selectattr('mode', 'eq', 'heat') | map(attribute='entity') | list }}

  # A lockout occurs only when both sides have units.
  conflict: >-
    {{ cooling_votes | count > 0 and heating_votes | count > 0 }}

  # A unit that operates keeps the outdoor unit.
  in_use: "{{ fleet | selectattr('calling') | list }}"

  # The side that operated last. The unit with the most recent change of demand
  # shows the last mode of the compressor. The blueprint reads this value only
  # when all units are quiet, which is the only time that it is correct.
  last_served: >-
    {% set ns = namespace(t=99999, mode='none') %}
    {% for f in fleet %}
      {% if f.since < ns.t %}
        {% set ns.t = f.since %}
        {% set ns.mode = f.mode %}
      {% endif %}
    {% endfor %}
    {{ ns.mode }}

  waiting_side: >-
    {{ 'heat' if last_served == 'cool'
       else 'cool' if last_served == 'heat' else 'none' }}

  # The units that change to fan mode: all units on the side that operated last.
  # Fan mode removes the demand that holds the outdoor unit.
  standdown: "{{ fleet | selectattr('mode', 'eq', last_served) | list }}"

  # Dry requests cooling, and the blueprint does not write to it. Thus dry holds
  # the cooling side.
  blocked_by_dry: "{{ last_served == 'cool' and dry_heads | count > 0 }}"

  # No unit may be stood down twice inside the cooldown. Measured on the units
  # that would be stood down: a stand-down writes fan mode and then writes the
  # mode back, so their last_changed is recent for exactly as long as it should
  # stop another one.
  cooldown_passed: >-
    {% set d = standdown | map(attribute='dwell') | list %}
    {{ d | count == 0 or d | min >= cooldown_minutes }}

  # All conditions for a change to fan mode, but not the dry block. The actions
  # examine the dry block, so that the blueprint reports it.
  lockout_ready: >-
    {{ lockout_protection and conflict and in_use | count == 0
       and last_served in ['cool', 'heat'] and standdown | count > 0
       and cooldown_passed }}

  # Everything that has to be true before the automation writes anything.
  ready: >-
    {{ (changes | count > 0 or lockout_ready) and settle_passed }}

  # --- what the trace shows ---------------------------------------------------
  # These two change nothing. They exist so that a run which stops at the
  # conditions still says why. Open the trace, select the trigger step, and read
  # `decision` in Changed Variables. `report` is the evidence behind it.
  # Defined last, because they use almost everything above.
  report: >-
    {%- set ns = namespace(lines=[], ignored=[]) -%}
    {%- set participating = fleet | map(attribute='entity') | list -%}
    {%- for c in climate_entities if c not in participating -%}
      {%- set ns.ignored = ns.ignored + [(c | replace('climate.', '')) ~ '(' ~ states(c) ~ ')'] -%}
    {%- endfor -%}
    {%- for f in fleet -%}
      {%- set flag = ' CHANGE->' ~ f.want if f.change
                else ' HELD ' ~ f.dwell ~ '/' ~ dwell_minutes ~ 'm' if f.held
                else '' -%}
      {%- set ns.lines = ns.lines + [
           (f.entity | replace('climate.', '')) ~ ' ' ~ f.mode
           ~ ' room ' ~ f.temp ~ ' set ' ~ f.target
           ~ ' (turns at ' ~ (f.target - cool_limit if f.mode == 'cool' else f.target + heat_limit) ~ ')'
           ~ ' call=' ~ ('Y' if f.calling else 'N')
           ~ ' quiet=' ~ f.since ~ 'm' ~ flag] -%}
    {%- endfor -%}
    {{ ns.lines | join(' | ') }}
    {{- '  DRY: ' ~ (dry_heads | map('replace', 'climate.', '') | join(', '))
       if dry_heads | count > 0 else '' }}
    {{- '  IGNORED: ' ~ (ns.ignored | join(', ')) if ns.ignored | count > 0 else '' }}

  decision: >-
    {%- set short = held | map(attribute='entity') | map('replace', 'climate.', '') | list -%}
    {%- set hold = '  (also holding ' ~ (short | join(', ')) ~ ' on dwell)'
                   if held | count > 0 else '' -%}
    {%- if not settle_passed and (changes | count > 0 or lockout_ready) -%}
      WAIT settle - there is something to do, but a unit changed mode less than
      {{ settle_minutes }}m ago and may not have reported its new state yet
    {%- elif changes | count > 0 -%}
      ACT mode change:
      {%- for f in changes %} {{ f.entity | replace('climate.', '') }}
      {{- ' ' ~ f.mode }}->{{ f.want }}{{ ',' if not loop.last }}{% endfor %}
    {%- elif lockout_ready and blocked_by_dry -%}
      HELD lockout blocked by dry:
      {{ dry_heads | map('replace', 'climate.', '') | join(', ') }}
      votes cooling and is never written to{{ hold }}
    {%- elif lockout_ready -%}
      ACT lockout: stand down
      {{ standdown | map(attribute='entity') | map('replace', 'climate.', '') | join(', ') }}
      so {{ waiting_side }} can run{{ hold }}
    {%- elif fleet | count == 0 -%}
      IDLE no unit is in cool or heat with both a room temperature and a setpoint
    {%- elif held | count > 0 and not conflict -%}
      IDLE {{ short | join(', ') }} {{ 'has' if held | count == 1 else 'have' }}
      passed a limit but {{ 'is' if held | count == 1 else 'are' }} still inside
      the {{ dwell_minutes }}m dwell. No lockout.
    {%- elif not conflict -%}
      IDLE no unit has passed its limit, and every unit requests the same mode
      ({{ 'cooling' if cooling_votes | count > 0 else 'heating' }})
    {%- elif not lockout_protection -%}
      IDLE units request opposite modes, but Lockout protection is off{{ hold }}
    {%- elif in_use | count > 0 -%}
      IDLE lockout, but
      {{ in_use | map(attribute='entity') | map('replace', 'climate.', '') | join(', ') }}
      still {{ 'counts' if in_use | count == 1 else 'count' }} as in use
      (release grace {{ release_grace_minutes }}m){{ hold }}
    {%- elif last_served == 'none' -%}
      IDLE lockout, but no Compressor Demand sensor matched any unit, so the side
      that operated last is unknown. Check the sensors are selected and on the
      same device as their climate entity.{{ hold }}
    {%- elif standdown | count == 0 -%}
      IDLE lockout, but there is nothing to stand down{{ hold }}
    {%- elif not cooldown_passed -%}
      IDLE lockout, but
      {{ standdown | map(attribute='entity') | map('replace', 'climate.', '') | join(', ') }}
      changed mode {{ standdown | map(attribute='dwell') | list | min }}m ago,
      inside the {{ cooldown_minutes }}m cooldown{{ hold }}
    {%- else -%}
      IDLE lockout, reason not classified{{ hold }}
    {%- endif -%}

conditions:
  # No action is the usual result, and the run stops here. Debug logging is the
  # exception: it has to reach the actions, because only an action can write to
  # the logbook. `ready` carries the settle time, so the actions check it again
  # before they write anything.
  - alias: Anything to do, or is debug logging on? (read `decision` in the trace)
    condition: template
    value_template: "{{ ready or debug_logbook }}"

actions:
  # Debug logging first, and outside the `ready` gate, so that a run which does
  # nothing still says what it decided. It writes one entry every five minutes
  # while it is on.
  - alias: Debug - write the decision and the evidence to the logbook
    if:
      - condition: template
        value_template: "{{ debug_logbook }}"
    then:
      - action: logbook.log
        data:
          name: MHI AUTO Replacement (debug)
          message: "{{ decision }}   ||   {{ report }}"

  # Everything below writes to a unit, so it is gated again here. The condition
  # above lets debug-only runs through, and they must stop at this point.
  - alias: Act
    if:
      - condition: template
        value_template: "{{ ready }}"
    then:
      # One run does one task. A mode change is first. The lockout check then
      # waits for the next run, when the new modes are in the state.
      - choose:
          - alias: Change the units that passed a limit
            conditions:
              - condition: template
                value_template: "{{ changes | count > 0 }}"
            sequence:
              - alias: Write the changes and their data to the logbook
                action: logbook.log
                data:
                  name: MHI AUTO Replacement
                  message: >-
                    Limits −{{ cool_limit }}/+{{ heat_limit }}°C from the setpoint.
                    {% for f in changes %}{{ f.entity | replace('climate.', '') }}:
                    {{ f.mode }} to {{ f.want }}
                    (room {{ f.temp }}°C, setpoint {{ f.target }}°C){{ ", " if not loop.last }}{% endfor %}.
                    {%- if held | count > 0 %}
                    No change to {% for f in held %}{{ f.entity | replace('climate.', '') }}
                    ({{ f.want }} necessary, dwell {{ f.dwell }}m of
                    {{ dwell_minutes }}m){{ ", " if not loop.last }}{% endfor %}.
                    {%- endif %}

              - repeat:
                  for_each: "{{ changes }}"
                  sequence:
                    # Read the state again. The blueprint read it at the start of the
                    # run. If the unit changed after that time - manually, from the
                    # app, or from the remote control - that change is more recent
                    # than this one. Each command also holds the module for
                    # approximately one minute.
                    - if:
                        - condition: template
                          value_template: "{{ states(repeat.item.entity) == repeat.item.mode }}"
                      then:
                        # The mode only. The setpoint is yours, and it does not
                        # change. Thus the unit controls to the same temperature
                        # from the other direction.
                        - action: climate.set_hvac_mode
                          target:
                            entity_id: "{{ repeat.item.entity }}"
                          data:
                            hvac_mode: "{{ repeat.item.want }}"

              - alias: If the protection is off, report a split and make no change
                if:
                  - condition: template
                    value_template: "{{ not lockout_protection and after_split }}"
                then:
                  - action: logbook.log
                    data:
                      name: MHI AUTO Replacement
                      message: >-
                        The units request opposite modes. One outdoor unit supplies
                        one mode, thus one unit is locked out and its room
                        temperature moves away from the setpoint. Set Lockout
                        protection to on, or remove a unit from the group.

          - alias: Resolve a lockout
            conditions:
              - condition: template
                value_template: "{{ lockout_ready }}"
            sequence:
              - choose:
                  - alias: Dry holds the cooling side
                    conditions:
                      - condition: template
                        value_template: "{{ blocked_by_dry }}"
                    sequence:
                      - action: logbook.log
                        data:
                          name: MHI AUTO Replacement
                          message: >-
                            Dry holds the outdoor unit. Heating cannot get it,
                            because
                            {{ dry_heads | map('replace', 'climate.', '') | join(', ') }}
                            {{ 'is' if dry_heads | count == 1 else 'are' }} in dry.
                            Dry requests cooling, and this blueprint does not write
                            to it. Change it out of dry to release the outdoor unit.

                default:
                  - alias: Write the action and the unit data to the logbook
                    action: logbook.log
                    data:
                      name: MHI AUTO Replacement
                      message: >-
                        The {{ last_served }} side operated last. Change
                        {{ standdown | map(attribute='entity') | map('replace', 'climate.', '') | join(', ') }}
                        to fan mode for {{ relax_delay }}. The {{ waiting_side }}
                        side can then operate.
                        Units: {% for f in fleet %}{{ f.entity | replace('climate.', '') }}
                        [{{ f.mode }} call={{ 'Y' if f.calling else 'N' }}
                        quiet={{ f.since }}m {{ f.temp }}/{{ f.target }}C]{{ ", " if not loop.last }}{% endfor %}

                  - alias: Change that side to fan mode to remove its demand
                    action: climate.set_hvac_mode
                    target:
                      entity_id: "{{ standdown | map(attribute='entity') | list }}"
                    data:
                      hvac_mode: fan_only

                  - alias: Wait for the outdoor unit to change side
                    delay: "{{ relax_delay }}"

                  - alias: Put each unit back to its mode
                    repeat:
                      for_each: "{{ standdown }}"
                      sequence:
                        # Write only if the unit is still in fan mode. If you changed
                        # the mode during the delay, your mode stays. A command that
                        # makes no change also holds the module for approximately one
                        # minute.
                        - if:
                            - condition: template
                              value_template: "{{ states(repeat.item.entity) == 'fan_only' }}"
                          then:
                            - action: climate.set_hvac_mode
                              target:
                                entity_id: "{{ repeat.item.entity }}"
                              data:
                                hvac_mode: "{{ repeat.item.mode }}"
